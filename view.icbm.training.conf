# ==============================================================================
# Nginx Configuration for view.icbm.training
# Proxies HTTPS traffic to the SLinT Showcase container running on port 3050
# ==============================================================================

# HTTP Server Block - Redirects all HTTP traffic to HTTPS & handles Let's Encrypt
server {
    listen 80;
    listen [::]:80;
    server_name view.icbm.training;

    # Allow Let's Encrypt Certbot challenge requests
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name view.icbm.training;

    # SSL Certificates (managed by Certbot or custom certificates)
    # If using certbot, these paths will be configured automatically:
    ssl_certificate /etc/letsencrypt/live/view.icbm.training/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/view.icbm.training/privkey.pem;

    # Modern SSL Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Maximum upload size
    client_max_body_size 50M;

    # Reverse proxy to the Docker container running on port 3050
    location / {
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;

        # WebSocket & connection upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward host and real client IP information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
